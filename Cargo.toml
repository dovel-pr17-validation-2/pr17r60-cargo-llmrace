[package]
name = "llmrace"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Race LLM providers head-to-head in your terminal: latency, TTFB, tokens/s, p95 and cost — live."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dfbustosus/llmrace"
homepage = "https://github.com/dfbustosus/llmrace"
readme = "README.md"
keywords = ["llm", "ai", "benchmark", "cli", "openai"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sse"
harness = false

[profile.release]
lto = true
strip = true
